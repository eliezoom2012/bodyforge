<style>

*,*:before,*:after{box-sizing:inherit}

h1{font-size:34px;letter-spacing:.5px}h2{font-size:22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}

.rec{color:var(--acc);font-weight:600;font-size:14px}

.wide{overflow-x:auto}svg{width:100%;height:auto;display:block}.x{padding:4px 10px;min-height:36px}

<script>

var S={unit:"kg",day:"Full Body A",tab:"today",rs:60,log:[],bw:[],routines:{

function el(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dw(kg){return S.unit==="kg"?Math.round(kg*2)/2:Math.round(kg*LB*2)/2}

function un(ex){return HOLD[ex]?"sec":"reps"}
function days(){return Object.keys(S.routines)}
if(!S.routines[S.day])S.day=days()[0];
function toast(m){var t=el("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3500)}

function tick(){if(!S.rest)return;var l=Math.ceil((S.rest-Date.now())/1000),b=el("rest");if(l<=0){S.rest=0;clearInterval(TM);b.hidden=true;beep();toast("Rest over. Next set.");return}b.hidden=false;el("rt").textContent="Rest "+Math.floor(l/60)+":"+String(l%60).padStart(2,"0")}
function rest(s){S.rest=Date.now()+s*1000;clearInterval(TM);TM=setInterval(tick,250);tick()}
function prev(ex){var t=today(),d=null;S.log.forEach(function(l){if(l.ex===ex&&l.d<t&&(!d||l.d>d))d=l.d});return d?S.log.filter(function(l){return l.ex===ex&&l.d===d}):[]}
function rec(e){var p=prev(e[0]);if(!p.length)return null;var ok=p.length>=e[1]&&p.every(function(l){return l.r>=e[2]}),u=un(e[0]),n=NEXT[e[0]];
return{last:p.map(function(l){return l.r}).join(", "),txt:ok?(n?"You hit every target. Try "+n+" next, starting with fewer reps.":"You hit every target. Add "+(HOLD[e[0]]?"5 seconds":"1 rep")+" to each set or lower slowly for 3 seconds."):"Aim for "+e[2]+" "+u+" on every set."}}
function plat(ex){var by={};S.log.forEach(function(l){if(l.ex===ex)by[l.d]=Math.max(by[l.d]||0,l.r)});var ks=Object.keys(by).sort();if(ks.length<4)return false;var b=Math.max.apply(null,ks.slice(0,-3).map(function(k){return by[k]})),m=Math.max.apply(null,ks.slice(-3).map(function(k){return by[k]}));return m<=b}
function chips(){return'<div class="chips">'+days().map(function(d){return'<button class="'+(d===S.day?"on":"")+'" data-a="day" data-v="'+esc(d)+'">'+esc(d)+"</button>"}).join("")+"</div>"}
function today_(){var h=chips()+'<div class="in" style="margin-bottom:12px"><label for="rs">Rest timer after each set</label><select id="rs">'+[[0,"Off"],[30,"30 sec"],[45,"45 sec"],[60,"1 min"],[90,"1.5 min"],[120,"2 min"]].map(function(x){return'<option value="'+x[0]+'"'+(x[0]===S.rs?" selected":"")+">"+x[1]+"</option>"}).join("")+"</select></div>";
S.routines[S.day].forEach(function(e,i){var r=rec(e),u=un(e[0]),ts=S.log.map(function(l,j){return{l:l,j:j}}).filter(function(o){return o.l.d===today()&&o.l.ex===e[0]}),lt=ts.length?ts[ts.length-1].l.r:e[2];
h+='<section class="card"><div class="row" style="justify-content:space-between"><h2>'+esc(e[0])+'</h2><span class="sub">'+e[1]+" × "+e[2]+" "+u+"</span></div>";
h+=r?'<div class="sub">Last time: '+r.last+'</div><div class="rec">'+r.txt+"</div>":'<div class="sub">First time. Go for '+e[2]+" "+u+" per set with clean form.</div>";
if(plat(e[0]))h+='<div class="sub"><b>No progress in 3 workouts.</b> Rest a day or two, or switch to an easier variation, then build back up.</div>';
h+='<div class="sets">'+ts.map(function(o,n){return'<button class="set" data-a="del" data-v="'+o.j+'" aria-label="Remove set '+(n+1)+'">'+o.l.r+" ✕</button>"}).join("")+'</div><div class="row"><div class="in"><label for="r'+i+'">'+(HOLD[e[0]]?"Seconds":"Reps")+'</label><input id="r'+i+'" type="number" inputmode="numeric" value="'+lt+'"></div><button class="pri" style="align-self:end" data-a="log" data-v="'+i+'">Log set</button></div></section>'});return h}
function routines_(){var h=chips()+'<section class="card">';S.routines[S.day].forEach(function(e,i){h+='<div class="row" style="justify-content:space-between;padding:6px 0"><span>'+esc(e[0])+' <span class="sub">'+e[1]+" × "+e[2]+" "+un(e[0])+'</span></span><button class="x" data-a="rm" data-v="'+i+'" aria-label="Remove '+esc(e[0])+'">Remove</button></div>'});
return h+'</section><section class="card"><h2>Add exercise to '+esc(S.day)+'</h2><div class="in" style="margin:8px 0"><label for="nn">Name</label><input id="nn" list="dl"></div><div class="row"><div class="in"><label for="ns">Sets</label><input id="ns" type="number" inputmode="numeric" value="3"></div><div class="in"><label for="nr">Reps (or seconds)</label><input id="nr" type="number" inputmode="numeric" value="10"></div></div><button class="pri" style="margin-top:10px;width:100%" data-a="add">Add exercise</button></section><section class="card"><h2>New workout day</h2><div class="row" style="margin-top:8px"><input id="nd" placeholder="e.g. Core day" aria-label="Day name"><button class="pri" data-a="addday">Add day</button></div></section>'}
function chart(ks,vs,lab){var W=340,H=150,P=28,mx=Math.max.apply(null,vs),mn=Math.min.apply(null,vs),sp=mx-mn||1,xy=vs.map(function(v,i){return[P+(ks.length>1?i*(W-2*P)/(ks.length-1):(W-2*P)/2),H-P-(v-mn)/sp*(H-2*P)]});
return'<div class="wide"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(lab)+'"><polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" points="'+xy.map(function(p){return p.join(",")}).join(" ")+'"/>'+xy.map(function(p){return'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="var(--acc)"/>'}).join("")+'<text x="2" y="'+(H-P+4)+'" fill="var(--mute)" font-size="11">'+mn+'</text><text x="2" y="'+(P+4)+'" fill="var(--mute)" font-size="11">'+mx+'</text><text x="'+P+'" y="'+(H-6)+'" fill="var(--mute)" font-size="11">'+ks[0]+'</text><text x="'+(W-P)+'" y="'+(H-6)+'" text-anchor="end" fill="var(--mute)" font-size="11">'+ks[ks.length-1]+"</text></svg></div>"}
function prog_(){var names=[],dts=[],d0=new Date();d0.setDate(d0.getDate()-6);var ws=d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+"-"+String(d0.getDate()).padStart(2,"0");S.log.forEach(function(l){if(names.indexOf(l.ex)<0)names.push(l.ex);if(dts.indexOf(l.d)<0)dts.push(l.d)});
var h='<div class="stats"><div class="card"><div class="num big">'+dts.filter(function(d){return d>=ws}).length+'</div><div class="sub">Workouts, last 7 days</div></div><div class="card"><div class="num big">'+dts.length+'</div><div class="sub">Workouts logged</div></div></div>';
if(!names.length)return h+'<section class="card" style="margin-top:12px"><h2>No sets yet</h2><div class="sub">Log your first set on the Today tab. Your charts, records and weekly volume show up here.</div></section>';
if(!S.prog||names.indexOf(S.prog)<0)S.prog=names[0];var pts={};S.log.forEach(function(l){if(l.ex===S.prog)pts[l.d]=Math.max(pts[l.d]||0,l.r)});var ks=Object.keys(pts).sort(),vs=ks.map(function(k){return pts[k]});
h+='<section class="card" style="margin-top:12px"><div class="in"><label for="ps">Exercise</label><select id="ps">'+names.map(function(n){return"<option"+(n===S.prog?" selected":"")+">"+esc(n)+"</option>"}).join("")+'</select></div><div class="row" style="justify-content:space-between;margin:12px 0 4px"><h2>Best set per workout</h2><span class="rec">Record '+Math.max.apply(null,vs)+" "+un(S.prog)+"</span></div>"+chart(ks,vs,"Progress for "+S.prog)+"</section>";
var vol={};S.log.forEach(function(l){if(l.d>=ws){var g=MUS[l.ex]||"Other";vol[g]=(vol[g]||0)+1}});
return h+'<section class="card"><h2>Sets this week</h2><div class="sub" style="margin-bottom:8px">10 to 20 sets a week per muscle group is a common range for building strength.</div>'+Object.keys(vol).map(function(g){return'<div class="row" style="margin:6px 0"><span style="width:84px">'+g+'</span><div style="flex:1;background:var(--bg);border-radius:6px;height:14px"><div style="width:'+Math.min(100,vol[g]/20*100)+'%;background:var(--acc);height:14px;border-radius:6px"></div></div><b style="width:28px;text-align:right">'+vol[g]+"</b></div>"}).join("")+"</section>"}
var PUSH={b:"Incline push-up",i:"Push-up",a:"Decline push-up"},PUSH2={b:"Chair dip",i:"Pike push-up",a:"Archer push-up"},PULL={b:"Table row",i:"Table row",a:"Feet-up table row"},PULL2={b:"Superman",i:"Backpack row",a:"Backpack row"},QUAD={b:"Squat",i:"Split squat",a:"Bulgarian split squat"},HING={b:"Glute bridge",i:"Single-leg glute bridge",a:"Single-leg glute bridge"},CORE={b:"Dead bug",i:"Plank",a:"Hollow hold"},CORE2={b:"Bird dog",i:"Side plank",a:"Leg raise"},CALF="Calf raise";
var T={"Full Body A":[QUAD,PUSH,PULL,CORE],"Full Body B":[HING,PUSH2,PULL2,CORE2],"Full Body C":[QUAD,PUSH,PULL,CALF],Upper:[PUSH,PULL,PUSH2,PULL2],Lower:[QUAD,HING,CALF,CORE],"Upper B":[PUSH2,PULL2,PUSH,PULL],"Lower B":[HING,QUAD,CALF,CORE2],Push:[PUSH,PUSH2,CORE2],Pull:[PULL,PULL2,CORE],Legs:[QUAD,HING,CALF]};
var SPLIT={2:["Full Body A","Full Body B"],3:["Full Body A","Full Body B","Full Body C"],4:["Upper","Lower","Upper B","Lower B"],5:["Push","Pull","Legs","Upper","Lower"]};
function gen(f){var bmi=f.w/Math.pow(f.h/100,2),old=f.age>=50,yng=f.age<18,R={},N=[],base={strength:8,muscle:12,fat:15,fit:12}[f.goal];
SPLIT[f.days].forEach(function(d){R[d]=T[d].map(function(sl,i){var n=typeof sl==="string"?sl:sl[f.lv],r=n===CALF?20:base;if(old||yng)r=Math.max(r,10);if(HOLD[n])r=f.lv==="b"?20:f.lv==="i"?30:40;return[n,(f.lv==="a"&&i<2&&!old&&!yng)?4:3,r]})});
N.push(f.days+" days a week. Rest at least a day between sessions that train the same muscles.");
N.push("Everything uses the floor, a wall, a sturdy table or chair, and a backpack or towel. No equipment needed.");
N.push(f.goal==="strength"?"Strength: fewer reps with the hardest variation you can control. Rest 1.5 to 2 minutes.":f.goal==="muscle"?"Muscle: slow reps, 3 seconds down, and stop 1 or 2 reps before failure.":f.goal==="fat"?"Fat loss: add a daily walk on top. Consistency matters more than intensity.":"General fitness: keep the reps smooth and add a daily walk.");
if(f.lv==="b")N.push("Beginner: start with the easier version of each move and add reps first. Bodyforge tells you when to move up.");
if(old)N.push("At 50 and over: warm up for 8 to 10 minutes and stop each set with 1 or 2 reps left.");
if(yng)N.push("Under 18: focus on form and train with supervision.");
if(bmi>=30)N.push("Your height and weight suggest starting with the easier variations and skipping jumping moves. Walking is a good low-impact add-on.");
if(bmi<18.5)N.push("Your height and weight suggest slow reps and enough rest and food to support progress.");
N.push("Stop and rest if a joint hurts, especially wrists, shoulders on dips, and knees.");return{R:R,N:N}}
function inp(id,l,v,m){return'<div class="in"><label for="'+id+'">'+l+'</label><input id="'+id+'" type="number" inputmode="'+(m||"decimal")+'" value="'+(v||"")+'"></div>'}
function sel(id,l,o,v){return'<div class="in"><label for="'+id+'">'+l+'</label><select id="'+id+'">'+o.map(function(x){return'<option value="'+x[0]+'"'+(String(x[0])===String(v)?" selected":"")+">"+x[1]+"</option>"}).join("")+"</select></div>"}
function plan_(){var f=S.pf||{goal:"muscle",days:3,lv:"b"};
var h='<section class="card"><h2>Build my plan</h2><div class="sub">Age, height and weight set the volume and intensity. Goal, days and level set the split and exercises. No equipment needed.</div><div class="row" style="margin:10px 0">'+inp("pa","Age",f.age,"numeric")+inp("ph","Height ("+(S.unit==="kg"?"cm":"in")+")",f.hh)+inp("pw","Weight ("+S.unit+")",f.ww)+'</div><div class="row" style="margin-bottom:10px">'+sel("pg","Goal",[["strength","Get stronger"],["muscle","Build muscle"],["fat","Lose fat"],["fit","General fitness"]],f.goal)+sel("pd","Days a week",[[2,"2"],[3,"3"],[4,"4"],[5,"5"]],f.days)+"</div>"+sel("pl","Level",[["b","Beginner (cannot do 10 push-ups)"],["i","Intermediate (10+ push-ups)"],["a","Advanced (20+ push-ups)"]],f.lv)+'<button class="pri" style="margin-top:12px;width:100%" data-a="build">Build plan</button></section>';
if(S.err)h+='<div class="card" role="alert">'+S.err+"</div>";
if(S.pv){h+='<section class="card"><h2>Notes for you</h2><ul style="padding-left:18px;margin:8px 0">'+S.pv.N.map(function(n){return"<li>"+esc(n)+"</li>"}).join("")+"</ul></section>";
Object.keys(S.pv.R).forEach(function(d){h+='<section class="card"><h2>'+esc(d)+"</h2>"+S.pv.R[d].map(function(e){return'<div class="row" style="justify-content:space-between;padding:4px 0"><span>'+esc(e[0])+'</span><span class="sub">'+e[1]+" × "+e[2]+" "+un(e[0])+"</span></div>"}).join("")+"</section>"});
h+='<button class="pri" style="width:100%" data-a="use">Use this plan</button><p class="sub">This replaces your current routines. Your logged history stays.</p><p class="sub">General guidance, not medical advice. If you have an injury or health condition, check with a doctor first.</p>'}return h}
function tools_(){var u=S.unit,bw=S.bw.slice().sort(function(a,b){return a.d<b.d?-1:1});
var h='<section class="card"><h2>Warm-up, 5 minutes</h2><ul style="padding-left:18px;margin:8px 0"><li>Arm circles, 20 each way</li><li>Hip circles and leg swings, 10 each side</li><li>Cat-cow, 10 slow reps</li><li>10 bodyweight squats</li><li>10 slow incline push-ups</li></ul><div class="sub">Finish with 2 to 3 minutes of stretching the muscles you trained.</div></section>';
